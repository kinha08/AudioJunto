[package]
name = "audio-junto"
version = "0.1.3"
edition = "2021"
description = "Duplique o áudio do Windows em vários dispositivos"
license = "MIT"

[dependencies]
anyhow = "1"
raw-window-handle = "0.6.2"
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts", "persistence"] }
serde = { version = "1", features = ["derive"] }
tray-icon = "0.26.1"
wasapi = "0.27.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
strip = true

