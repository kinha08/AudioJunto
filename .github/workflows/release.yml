name: Windows release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - installer/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test and build
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup override set stable
          cargo fmt --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --release --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/audio-junto.exe installer/payload/AudioJunto.exe
          $compilers = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $compiler = $compilers | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler not found' }
          & $compiler "/O$PWD\dist" installer/AudioJunto.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish version and assets
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $tag = "v$version"
          $setup = "dist/AudioJunto-Setup-$version.exe"
          if (-not (Test-Path $setup)) { throw 'Installer and Cargo versions do not match' }
          Copy-Item target/release/audio-junto.exe "dist/AudioJunto-$version.exe"
          $checksums = Get-ChildItem dist/*.exe | Sort-Object Name | ForEach-Object {
            "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)"
          }
          $checksums | Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
          $env:RELEASE_VERSION = $version
          python .github/release.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
